name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -A x64

      - name: Build Standalone Executable
        run: |
          cmake --build build --config Release

      - name: Verify Executable in CI (CLI mode)
        run: |
          $exePath = "build\Release\rw-benchmark.exe"
          if (!(Test-Path $exePath)) {
            $exePath = "build\rw-benchmark.exe"
          }
          Write-Host "Verifying binary at $exePath"
          & $exePath --cli

      - name: Verify Headless UI Screenshot
        run: |
          $exePath = "build\Release\rw-benchmark.exe"
          if (!(Test-Path $exePath)) {
            $exePath = "build\rw-benchmark.exe"
          }
          $fullPath = [System.IO.Path]::GetFullPath("preview.png")
          Write-Host "Rendering offscreen UI screenshot with $exePath to $fullPath"
          $proc = Start-Process -FilePath $exePath -ArgumentList @("--screenshot", "`"$fullPath`"") -Wait -PassThru -NoNewWindow
          Write-Host "rw-benchmark process finished with exit code: $($proc.ExitCode)"
          if (Test-Path "screenshot.log") {
            Get-Content "screenshot.log"
          }
          if (!(Test-Path $fullPath)) {
            Write-Error "Screenshot file was not generated at $fullPath!"
            exit 1
          }

      - name: Upload UI Preview Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: preview.png

      - name: Package Artifact
        run: |
          $exePath = "build\Release\rw-benchmark.exe"
          if (!(Test-Path $exePath)) {
            $exePath = "build\rw-benchmark.exe"
          }
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item $exePath -Destination "dist\rw-benchmark.exe"
          Compress-Archive -Path "dist\rw-benchmark.exe", "README.md", "LICENSE" -DestinationPath "rw-benchmark-windows-x64.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rw-benchmark-windows-x64
          path: rw-benchmark-windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rw-benchmark-windows-x64.zip
            preview.png
          name: RW-Bench ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
